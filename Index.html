<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcriber</title>
<style>
  :root {
    --bg: #14171a;
    --panel: #1d2226;
    --line: #2e353b;
    --text: #eef1f3;
    --muted: #9aa5ad;
    --accent: #f2b84b;
    --accent-text: #1a1405;
    --error: #ff7a6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 4px; font-weight: 700; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  label { display: block; margin: 18px 0 6px; font-weight: 700; }
  input[type=password], input[type=file], select {
    width: 100%;
    padding: 12px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 16px;
  }
  button {
    padding: 14px 18px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  button.ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    font-weight: 400;
  }
  button:disabled { opacity: .5; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  #go { width: 100%; margin-top: 22px; }
  #status { margin-top: 14px; color: var(--muted); min-height: 24px; }
  #status.error { color: var(--error); }
  textarea {
    width: 100%;
    min-height: 320px;
    margin-top: 6px;
    padding: 12px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.6;
  }
  .hide { display: none; }
  .note { font-size: 14px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>Transcriber</h1>
  <p class="sub">Upload audio. Get a clean transcript.</p>

  <label for="key">Groq API key</label>
  <input id="key" type="password" placeholder="Paste your key here" autocomplete="off">
  <p class="note">Saved only in this browser. It is never uploaded to GitHub.</p>

  <label for="file">Audio file</label>
  <input id="file" type="file" accept="audio/*,video/*,.mp3,.m4a,.wav,.ogg,.opus,.mp4,.webm,.flac">
  <p class="note">Maximum 25 MB per file.</p>

  <label for="lang">Language</label>
  <select id="lang">
    <option value="">Detect automatically</option>
    <option value="en">English</option>
    <option value="af">Afrikaans</option>
    <option value="zu">Zulu</option>
    <option value="xh">Xhosa</option>
    <option value="st">Sesotho</option>
    <option value="sn">Shona</option>
    <option value="sw">Swahili</option>
  </select>
  <p class="note">If a language is not supported, choose automatic.</p>

  <button id="go">Transcribe</button>
  <div id="status"></div>

  <div id="out" class="hide">
    <label for="text">Transcript</label>
    <textarea id="text"></textarea>
    <div class="row">
      <button id="copy">Copy text</button>
      <button id="save" class="ghost">Download .txt</button>
      <button id="raw" class="ghost">Show raw version</button>
    </div>
  </div>
</main>

<script>
  var keyEl = document.getElementById('key');
  var fileEl = document.getElementById('file');
  var langEl = document.getElementById('lang');
  var goEl = document.getElementById('go');
  var statusEl = document.getElementById('status');
  var outEl = document.getElementById('out');
  var textEl = document.getElementById('text');
  var cleanText = '';
  var rawText = '';
  var showingRaw = false;

  try { keyEl.value = localStorage.getItem('groq_key') || ''; } catch (e) {}

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = isError ? 'error' : '';
  }

  async function transcribe(key, file, lang) {
    var form = new FormData();
    form.append('file', file);
    form.append('model', 'whisper-large-v3-turbo');
    form.append('response_format', 'json');
    if (lang) form.append('language', lang);
    var res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + key },
      body: form
    });
    if (!res.ok) {
      var err = await res.text();
      throw new Error('Transcription failed (' + res.status + '). ' + err.slice(0, 200));
    }
    var data = await res.json();
    return data.text || '';
  }

  async function cleanUp(key, raw) {
    var res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + key,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'openai/gpt-oss-20b',
        temperature: 0.2,
        messages: [
          {
            role: 'system',
            content: 'You clean up speech transcripts. Fix punctuation, capitalisation and paragraph breaks. Remove filler words like um and uh. Do not change the meaning, do not add or remove information, do not summarise, and do not translate. Return only the cleaned transcript.'
          },
          { role: 'user', content: raw }
        ]
      })
    });
    if (!res.ok) throw new Error('Cleanup failed (' + res.status + ')');
    var data = await res.json();
    return data.choices[0].message.content.trim();
  }

  goEl.addEventListener('click', async function () {
    var key = keyEl.value.trim();
    var file = fileEl.files[0];
    if (!key) { setStatus('Paste your Groq API key first.', true); return; }
    if (!file) { setStatus('Choose an audio file first.', true); return; }
    if (file.size > 25 * 1024 * 1024) {
      setStatus('This file is over 25 MB. Compress it or split it into parts.', true);
      return;
    }
    try { localStorage.setItem('groq_key', key); } catch (e) {}

    goEl.disabled = true;
    outEl.classList.add('hide');
    try {
      setStatus('Transcribing... this can take a minute.');
      rawText = await transcribe(key, file, langEl.value);
      if (!rawText.trim()) throw new Error('No speech was found in this file.');

      setStatus('Cleaning up the text...');
      try {
        cleanText = await cleanUp(key, rawText);
      } catch (e) {
        cleanText = rawText;
      }

      showingRaw = false;
      document.getElementById('raw').textContent = 'Show raw version';
      textEl.value = cleanText;
      outEl.classList.remove('hide');
      setStatus('Done.');
    } catch (e) {
      setStatus(e.message, true);
    }
    goEl.disabled = false;
  });

  document.getElementById('copy').addEventListener('click', async function () {
    try {
      await navigator.clipboard.writeText(textEl.value);
      setStatus('Copied.');
    } catch (e) {
      textEl.select();
      setStatus('Select the text and copy it manually.', true);
    }
  });

  document.getElementById('save').addEventListener('click', function () {
    var blob = new Blob([textEl.value], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'transcript.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  document.getElementById('raw').addEventListener('click', function () {
    showingRaw = !showingRaw;
    textEl.value = showingRaw ? rawText : cleanText;
    this.textContent = showingRaw ? 'Show cleaned version' : 'Show raw version';
  });
</script>
</body>
  </html>
